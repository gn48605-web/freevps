- name: Setup AnyDesk
        run: 
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe"
          cmd /c "AnyDesk.exe --install C:\AnyDesk --start-with-win --silent"
          Start-Sleep -Seconds 5
          echo "test1234" | C:\AnyDesk\AnyDesk.exe --set-password
          $id = C:\AnyDesk\AnyDesk.exe --get-id
          Write-Output "=================================="
          Write-Output "ANYDESK ID: $id"
          Write-Output "PASSWORD: test1234"
          Write-Output "=================================="
