name: Windows 10 RustDesk VPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download and Install RustDesk
      run: |
        Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe" -OutFile "rustdesk.exe"
        Start-Process -FilePath ".\rustdesk.exe" -ArgumentList "--silent-install" -Wait

    - name: Keep Alive & Run Loop
      run: |
        echo "VPS is running..."
        $i = 0
        while ($true) {
            Start-Sleep -Seconds 60
            $i++
            echo "Running for $i minutes"
        }
